<!-- ══ SOLD-OUT VARIANT ════════════════════════════════════════════════
         The same panel when the places run out. Kept in the mockup because it
         is the state that gets forgotten, and a workshop with ten places hits
         it every time it succeeds. Ten marks, all filled. -->
<section
  class="mt-24 border-t border-plate-rule/30 pt-14"
  aria-labelledby="variant"
>
  <p
    id="variant"
    class="fig font-mono text-[14px] uppercase tracking-[0.16em] text-gold"
  >
    The same panel, once it is full
  </p>
  <div class="mt-7 max-w-[400px]">
    <div class="pool on-pool px-7 py-8 sm:px-9">
      <h2 class="font-display text-[30px] font-normal leading-tight text-ink">
        This one is full
      </h2>

      <div class="mt-5">
        <div class="places" aria-hidden="true">
          <span data-taken></span>
          <span data-taken></span>
          <span data-taken></span>
          <span data-taken></span>
          <span data-taken></span>
          <span data-taken></span>
          <span data-taken></span>
          <span data-taken></span>
          <span data-taken></span>
          <span data-taken></span>
        </div>
        <p class="mt-2.5 fig font-mono text-[16px] text-ink-soft">
          0 places left of 10
        </p>
      </div>

      <p class="mt-5 text-[17px] leading-relaxed text-ink">
        All ten places have gone. If someone cancels, the place goes to the
        first person on the list.
      </p>
      <button
        type="submit"
        class="t mt-7 min-h-[56px] w-full border border-ink bg-transparent px-6 text-[19px] font-semibold text-ink hover:bg-ink hover:text-pool"
      >
        Tell me if a place opens
      </button>
      <p class="mt-4 text-[15px] leading-relaxed text-ink-soft">
        One email, only if a place actually opens. Nothing else.
      </p>
      <hr class="my-7 border-0 border-t border-pool-rule/40" />
      <p class="text-[17px] leading-relaxed text-ink">
        The next one is
        <a
          href="/workshops/grounding-for-beginners"
          class="text-action underline"
        >
          Grounding for Beginners</a
        >, on Saturday 14 November.
      </p>
    </div>
  </div>
</section>
