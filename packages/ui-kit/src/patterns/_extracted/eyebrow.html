<!--
  Pattern: eyebrow
  Extracted from: admin-dashboard.html (dominant/canonical shape — mono,
  15px/xs, gold, tracking-wide, uppercase) and home.html (a sans-serif
  17px/sm variant used on-plate/on-pool for marketing copy). Both are
  captured; the admin/mono shape is the DEFAULT per the canonical pattern
  table's required shape (mono font, xs size, wide tracking, uppercase).
-->
<p
  data-pattern="eyebrow"
  class="font-mono text-xs uppercase tracking-wide text-secondary-500"
>
  Needs you today
</p>

<!-- On-pool variant (admin): same shape, ink-soft color for a de-emphasised
     section like "Settled" or "The other states". -->
<p
  data-pattern="eyebrow"
  data-variant="muted"
  class="font-mono text-xs uppercase tracking-wide text-pool-text-secondary"
>
  Settled — nothing to do
</p>

<!-- Marketing/on-pool variant (webapp): sans-serif 17px/sm, semibold,
     accent-500 ink on a pool, or gold on a plate. -->
<p
  data-pattern="eyebrow"
  data-variant="marketing-on-pool"
  class="font-sans text-sm font-semibold uppercase tracking-wide text-accent-500"
>
  The hour, from inside the chair
</p>
<p
  data-pattern="eyebrow"
  data-variant="marketing-on-plate"
  class="font-sans text-sm font-semibold uppercase tracking-wide text-secondary-500"
>
  Aura healing &middot; hands-off &middot; one hour
</p>
