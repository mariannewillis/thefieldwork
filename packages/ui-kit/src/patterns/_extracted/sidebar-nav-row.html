<!--
  Pattern: sidebar-nav-row
  Extracted from: admin-dashboard.html .nav-item (11 instances in the rail)
  Shape: icon (24x24, stroke-width 1.6, currentColor) + label + optional
  right-aligned mono count badge. Default state reads as quiet text on the
  near-black ground; the CURRENT page state INVERTS to the pool fill (blush
  bg, ink text, bold) — the only nav row in the whole system that becomes a
  pool itself.
-->
<nav
  data-pattern="sidebar-nav-row"
  aria-label="Admin"
  class="flex flex-col gap-0.5"
>
  <!-- default -->
  <a
    href="/admin/calendar"
    class="flex min-h-[46px] items-center gap-3 px-3.5 text-sm font-medium text-text-secondary no-underline transition-colors duration-fast hover:bg-secondary-500/[.08] hover:text-text-primary"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="h-[18px] w-[18px] shrink-0"
      aria-hidden="true"
    >
      <rect x="3" y="4" width="18" height="17" rx="2" />
      <path d="M8 2v4M16 2v4M3 10h18" />
    </svg>
    Calendar
  </a>

  <!-- default, with count badge (bare mono text, no pill/background) -->
  <a
    href="/admin/bookings"
    class="flex min-h-[46px] items-center gap-3 px-3.5 text-sm font-medium text-text-secondary no-underline transition-colors duration-fast hover:bg-secondary-500/[.08] hover:text-text-primary"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="h-[18px] w-[18px] shrink-0"
      aria-hidden="true"
    >
      <path d="M22 12h-6l-2 3h-4l-2-3H2" />
      <path
        d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"
      />
    </svg>
    Requests
    <span class="ml-auto font-mono text-xs text-secondary-500">2</span>
  </a>

  <!-- current page — inverts to the pool fill -->
  <a
    href="/admin"
    aria-current="page"
    class="flex min-h-[46px] items-center gap-3 rounded-none bg-surface-inverted px-3.5 text-sm font-bold text-text-inverted no-underline"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="h-[18px] w-[18px] shrink-0"
      aria-hidden="true"
    >
      <rect x="3" y="3" width="7" height="9" rx="1" />
      <rect x="14" y="3" width="7" height="5" rx="1" />
      <rect x="14" y="12" width="7" height="9" rx="1" />
      <rect x="3" y="16" width="7" height="5" rx="1" />
    </svg>
    Today
  </a>
</nav>
